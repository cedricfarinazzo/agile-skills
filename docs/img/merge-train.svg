<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" xml:space="preserve">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#585b70"/></marker></defs>
<rect width="900" height="330" rx="10" fill="#1e1e2e"/>
<rect x="20" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#89dceb" stroke-width="1.5"/><text x="30" y="82" fill="#7f849c" font-size="12">3a</text><text x="30" y="104" fill="#cdd6f4" font-weight="bold">update</text><text x="30" y="124" fill="#cdd6f4" font-size="11">rebase on main</text><line x1="150" y1="106" x2="166" y2="106" stroke="#585b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="168" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#89dceb" stroke-width="1.5"/><text x="178" y="82" fill="#7f849c" font-size="12">3b</text><text x="178" y="104" fill="#cdd6f4" font-weight="bold">review</text><text x="178" y="124" fill="#cdd6f4" font-size="11">read every file</text><text x="178" y="138" fill="#cdd6f4" font-size="11">at the reviewed</text><text x="178" y="152" fill="#cdd6f4" font-size="11">sha</text><line x1="298" y1="106" x2="314" y2="106" stroke="#585b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="316" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#89dceb" stroke-width="1.5"/><text x="326" y="82" fill="#7f849c" font-size="12">3c</text><text x="326" y="104" fill="#cdd6f4" font-weight="bold">fix</text><text x="326" y="124" fill="#cdd6f4" font-size="11">Critical +</text><text x="326" y="138" fill="#cdd6f4" font-size="11">Minor, lint</text><text x="326" y="152" fill="#cdd6f4" font-size="11">before push</text><line x1="446" y1="106" x2="462" y2="106" stroke="#585b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="464" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#89dceb" stroke-width="1.5"/><text x="474" y="82" fill="#7f849c" font-size="12">3e</text><text x="474" y="104" fill="#cdd6f4" font-weight="bold">CI</text><text x="474" y="124" fill="#cdd6f4" font-size="11">fresh run on</text><text x="474" y="138" fill="#cdd6f4" font-size="11">the head</text><line x1="594" y1="106" x2="610" y2="106" stroke="#585b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="612" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/><text x="622" y="82" fill="#7f849c" font-size="12">3f</text><text x="622" y="104" fill="#cdd6f4" font-weight="bold">merge</text><text x="622" y="124" fill="#cdd6f4" font-size="11">pinned to the</text><text x="622" y="138" fill="#cdd6f4" font-size="11">reviewed sha</text><line x1="742" y1="106" x2="758" y2="106" stroke="#585b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="760" y="60" width="130" height="112" rx="8" fill="#313244" stroke="#89dceb" stroke-width="1.5"/><text x="770" y="82" fill="#7f849c" font-size="12">3g</text><text x="770" y="104" fill="#cdd6f4" font-weight="bold">postmortem</text><text x="770" y="124" fill="#cdd6f4" font-size="11">comment + Done</text><path d="M677 172 V 210 H 529 V 174" fill="none" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="468" y="230" fill="#f9e2af" font-size="12">landing tip ≠ reviewed sha: review the delta, back to CI</text><path d="M381 60 V 38 H 825 V 58" fill="none" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="320" y="30" fill="#f38ba8" font-size="12">3d: too broken to fix in one pass → postmortem (blocked), no merge</text><text x="20" y="290" fill="#7f849c" font-size="12">one PR at a time: each merge changes main, so the next PR rebases on the new tip and re-runs CI</text><text x="20" y="310" fill="#7f849c" font-size="12">a PR gets at most 2 review rounds per run and 3 fix rounds across runs; a 4th goes to a human</text>
</svg>
