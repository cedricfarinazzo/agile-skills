name: Dependency Risk Scan
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency risk scanner
        run: chmod +x tools/dependency-risk/scan.sh && ./tools/dependency-risk/scan.sh
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-risk-results
          path: tools/dependency-risk/results
