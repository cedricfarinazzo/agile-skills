name: validate

# claude plugin validate needs no login or API key: it only reads the manifests and files.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  marketplace:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Claude and Codex package parity
        run: |
          python3 .github/scripts/check-parity.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: ./.github/scripts/validate.sh .
      # the marketplace is the authoritative plugin list, so a new plugin is validated without editing this file
      - id: list
        run: echo "plugins=$(jq -c '[.plugins[].name]' .claude-plugin/marketplace.json)" >> "$GITHUB_OUTPUT"

  plugin:
    needs: marketplace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.marketplace.outputs.plugins) }}
    name: plugin (${{ matrix.plugin }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        # the name comes from marketplace.json, which a PR can change: pass it as data, never as shell text
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: ./.github/scripts/validate.sh "./$PLUGIN"

  mods-test:
    runs-on: ubuntu-latest
    name: agile-mods (bun test + claude plugin test)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@v2
      - name: bun test
        working-directory: agile-mods
        run: bun test
      # tests/engine loads the hooks module in the engine itself, with gh, git and Jira stubbed; no login needed
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin test
        run: claude plugin test ./agile-mods

  skills-ref:
    runs-on: ubuntu-latest
    name: skills (skills-ref)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@v6
      - name: Agent Skills reference validator
        run: ./.github/scripts/skills-ref.sh

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: version bump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Every changed plugin bumps its version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./.github/scripts/check-version-bump.sh "origin/$BASE_REF"
